{% extends "base.html" %}

{% block title %}Add New Vehicle — Enterprise{% endblock %}

{% block content %}
<main class="placeholder placeholder--enterprise" style="justify-content: flex-start; padding: 3rem 1.5rem;">
  <div style="max-width: 700px; width: 100%; margin: 0 auto; text-align: left;">
    
    <a href="{{ url_for('enterprise.vehicle_list') }}" style="color: var(--enterprise-accent-soft); display: inline-block; margin-bottom: 1rem;">← Back to Fleet</a>

    <div style="background: rgba(255,255,255,0.05); border-radius: 16px; padding: 2rem; border: 1px solid rgba(255,255,255,0.1);">
      <h1 style="color: var(--enterprise-accent); margin-top: 0;">Register New Fleet Vehicle</h1>

      <form method="POST" action="{{ url_for('enterprise.vehicle_new') }}" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
        
        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Reg Num (VIN)</label>
          <input type="text" name="reg_num" required placeholder="e.g. 1HGM82633A004352" style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Plate</label>
          <input type="text" name="plate" required placeholder="e.g. 3242 NRS" style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Brand</label>
          <input type="text" name="brand" required placeholder="e.g. Toyota" style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Model</label>
          <input type="text" name="model" required placeholder="e.g. Corolla" style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Vehicle Type</label>
          <select name="type" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
            {% for t in types %}
              <option value="{{ t }}">{{ t|capitalize }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Tier Category</label>
          <select name="category" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
            {% for tr in tiers %}
              <option value="{{ tr }}">{{ tr|capitalize }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Color Options</label>
          <select name="color" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
            {% for clr in colors %}
              <option value="{{ clr }}">{{ clr }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Daily Rate ($)</label>
          <input type="number" step="0.01" name="daily_rate" required placeholder="39.99" style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Seats</label>
          <input type="number" name="seat_num" value="5" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Initial Location</label>
          <select name="location" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
            {% for loc in locations %}
              <option value="{{ loc }}">{{ loc|capitalize }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Fuel Type</label>
          <select name="fuel" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
            {% for f in fuels %}
              <option value="{{ f }}">{{ f|capitalize }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Transmission</label>
          <select name="transmission" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
            {% for tr in transmissions %}
              <option value="{{ tr }}">{{ tr|capitalize }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Odometer (KM)</label>
          <input type="number" name="km" value="0" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <div>
          <label style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Manufacture Date</label>
          <input type="date" name="manufacture_date" required style="width: 100%; padding: 0.75rem; border-radius: 8px; background: var(--enterprise-bg); color: var(--enterprise-ink); border: 1px solid rgba(255,255,255,0.2);">
        </div>

        <div style="grid-column: span 2; margin-top: 1rem;">
          <button type="submit" style="width: 100%; background: var(--enterprise-accent); color: var(--enterprise-bg); padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;">
            Save & Add to Fleet
          </button>
        </div>

      </form>
    </div>

  </div>
</main>
{% endblock %}
