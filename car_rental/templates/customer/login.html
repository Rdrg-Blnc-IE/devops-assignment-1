{% extends "base.html" %}

{% block title %}Customer Login — Ruta7{% endblock %}

{% block content %}
<main class="placeholder placeholder--customer">
  <a href="{{ url_for('index') }}" class="placeholder__back">← Back to Home</a>

  <div style="max-width: 400px; width: 90%; text-align: left; background: rgba(255,255,255,0.6); padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--customer-accent);">Customer Login</h1>
    <p style="margin-bottom: 1.5rem; font-size: 0.95rem;">Enter your Customer ID to access your rental portal.</p>

    <form method="POST" action="{{ url_for('customer.login') }}" style="display: flex; flex-direction: column; gap: 1rem;">
      <div>
        <label for="customer_id" style="display: block; font-weight: 500; margin-bottom: 0.4rem; font-family: var(--font-ui);">Customer ID</label>
        {% if customers %}
          <select id="customer_id" name="customer_id" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;">
            <option value="" disabled selected>Select your ID</option>
            {% for cust in customers %}
              <option value="{{ cust.id }}">{{ cust.id }} - {{ cust.name if cust.name else 'Customer' }}</option>
            {% endfor %}
          </select>
        {% else %}
          <input type="text" id="customer_id" name="customer_id" placeholder="e.g. 1" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;">
        {% endif %}
      </div>

      <button type="submit" style="background: var(--customer-accent); color: #fff; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s;">
        Log In
      </button>
    </form>
  </div>
</main>
{% endblock %}
